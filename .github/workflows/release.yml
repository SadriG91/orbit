name: release

# Pushing a v* tag is the whole release process.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag can sit on a commit CI never saw, so re-run the suite here.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog needs the history

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped to the tap repo only. GITHUB_TOKEN cannot write to it.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Verify with: gh attestation verify <file> --repo SadriG91/orbit
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      # GoReleaser generates the cask (skip_upload) but its Ruby fails brew
      # style, so style it before pushing — one green commit on the tap.
      # --fix is best-effort: a new offence should show as a red audit there,
      # not block the release.
      - name: publish the cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cask=$(find dist -name 'orbit.rb' -print -quit)
          test -n "$cask" || { echo "no cask in dist/"; exit 1; }
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/SadriG91/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp "$cask" tap/Casks/orbit.rb
          cd tap
          brew style --fix Casks/orbit.rb || true
          git add Casks/orbit.rb
          if git diff --cached --quiet; then
            echo "cask unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Brew cask update for orbit ${GITHUB_REF_NAME}"
          git push
