name: release

# Tag-driven: pushing v* is the whole release process. Everything else —
# testing on both platforms, building for four, checksums, notes, provenance,
# publishing, and updating the Homebrew tap — happens here, so none of it can
# be half-done or forgotten.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag can be pushed at any commit, including one CI never saw. Releasing
  # without re-running the suite here would make "green on main" an assumption
  # rather than a fact about the thing being shipped.
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # changelog needs the history

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Scoped to the tap repo only. GITHUB_TOKEN cannot write to it.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Lets anyone verify a downloaded archive was built by this workflow from
      # this commit: `gh attestation verify <file> --repo SadriG91/orbit`.
      # Worth having for binaries strangers are asked to trust.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      # GoReleaser generates the cask but doesn't push it (skip_upload): its
      # Ruby trips brew's RuboCop rules — stanza grouping, array indentation —
      # and pushing it raw turned the tap's CI red on every release, with a
      # style-fix commit chasing it seconds later. Styling the file from dist/
      # first means the tap only ever sees one commit, already green. The fix
      # is best-effort on purpose: a new, non-autocorrectable offence should
      # show up as a red audit on the tap, not as a release that never
      # published its cask.
      - name: publish the cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cask=$(find dist -name 'orbit.rb' -print -quit)
          test -n "$cask" || { echo "no cask in dist/"; exit 1; }
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/SadriG91/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp "$cask" tap/Casks/orbit.rb
          cd tap
          brew style --fix Casks/orbit.rb || true
          git add Casks/orbit.rb
          if git diff --cached --quiet; then
            echo "cask unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Brew cask update for orbit ${GITHUB_REF_NAME}"
          git push
