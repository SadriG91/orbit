name: test

# Called by both ci.yml and release.yml rather than duplicated in each, so a
# release cannot run a weaker suite than a pull request does. The bug that made
# session listing fail outright on Ubuntu shipped in two releases precisely
# because the Linux job only compiled; there is no version of this worth
# testing on one platform.
on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: install tmux
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install tmux
          else
            sudo apt-get update && sudo apt-get install -y tmux
          fi
          tmux -V

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd: $unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go test -race ./...
