version: 2

project_name: orbit

before:
  hooks:
    # No test hook: the release workflow gates on the full suite across both
    # platforms before this runs, and repeating it here would only re-test
    # macOS while implying more.
    - go mod tidy

builds:
  - main: ./cmd/orbit
    binary: orbit
    # Nothing here needs libc, and a static binary is one less thing that can
    # differ between the machine that built it and the machine that runs it.
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      # .Tag, not .Version: .Version drops the leading v, so the binary would
      # report 0.2.1 for a release everyone else calls v0.2.1 — including the
      # updater, which compares this against the tag from the GitHub API.
      - -s -w -X main.version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}" # reproducible builds

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  # Grouped by what a reader cares about, not by commit order.
  sort: asc
  use: github
  groups:
    - title: Fixes
      regexp: '(?i)^.*?(fix|correct|repair)'
      order: 0
    - title: Features
      regexp: '(?i)^.*?(add|support|introduce)'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: orbit
    # Generated but not pushed: GoReleaser's Ruby trips brew's RuboCop rules,
    # and pushing it raw turned the tap's CI red on every release until the
    # style-fix commit landed seconds later. The workflow styles the file from
    # dist/ and pushes it in one green commit instead.
    skip_upload: true
    repository:
      owner: SadriG91
      name: homebrew-tap
      # A PAT, because the release runs in the orbit repo and GITHUB_TOKEN
      # cannot write to a different one.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/SadriG91/orbit
    description: Dashboard for the Claude Code, Codex and Copilot CLI sessions on your machine
    license: MIT
    binaries:
      - orbit
    dependencies:
      # Not optional: orbit runs every agent session on a private tmux server so
      # that closing a tab detaches instead of killing the work, and refuses to
      # start without it.
      - formula: tmux
    hooks:
      post:
        # The binary is downloaded rather than built locally, so macOS marks it
        # quarantined and Gatekeeper blocks the first run. Nothing here is
        # notarised, so clear the attribute rather than making every user
        # discover this for themselves.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/orbit"],
                           must_succeed: false
          end
    # A single line with no newlines at all, deliberately. GoReleaser emits
    # each line of the caveats as its own Ruby string literal inside
    # `caveats do ... end`, and a Ruby block evaluates to its last
    # expression — so anything but the final line is silently dropped.
    caveats: "Config is written to ~/.config/orbit/ on first run (tmux.conf and config.toml); both are yours to edit. Opening a session in a new Ghostty tab needs Accessibility permission for your terminal — without it, press `i` to attach in the current one instead."
release:
  github:
    owner: SadriG91
    name: orbit
  footer: |
    ## Install

    ```sh
    brew install sadrig91/tap/orbit
    ```

    Linux, or without Homebrew:

    ```sh
    go install github.com/sadrig91/orbit/cmd/orbit@{{ .Tag }}
    ```

    Requires tmux.
