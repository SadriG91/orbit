# orbit configuration. A key you delete falls back to its default, and orbit
# appends settings to this file as it gains them — it never edits or reorders
# what is already here, so anything you change stays changed.
# Environment variables (ORBIT_ICONS, ORBIT_SPAWN_DELAY, ...) still win over
# this file, so you can override a setting for one run without editing it.

# text | logo | auto   — the real agent marks need a terminal that speaks
# Kitty graphics (Ghostty, Kitty). auto uses them there and the cl/cx/cp text
# tags everywhere else; text pins it to the tags.
icons = "auto"

# smart | tab | window | inline   — what Enter does
attach = "smart"

# Desktop notification when a session starts wanting your attention.
notify = true

# Sessions older than this are hidden until you press `a`.
recent_days = 30

# age | tokens | project | agent   — press `o` to cycle at runtime
sort = "age"

# Group the list under project headings.
group = false

# Give the shell time to start before typing into it.
spawn_delay = "900ms"
tab_delay = "1s"

[summary]
# Summaries are generated on demand and cached, keyed by the session's last
# event — so a summary is only ever computed once per conversation state.
enabled = true

# Summarise whichever session you're sitting on, without pressing `s`.
# Off by default: it spends tokens as you browse.
auto = false

# Guards on automatic regeneration. A summary goes stale as soon as the session
# gains a message, but regenerating on every turn would bill you per prompt —
# so `auto` waits until a session is this far behind, and never interrupts a
# session that is mid-turn. Manual `s` ignores both and updates immediately.
auto_min_new_messages = 8

# Cap on the summary text itself.
max_chars = 420

# Cap on what gets *sent*. Summarising runs on cheap models, and cheap models
# have the smallest context windows — so the excerpt is deliberately a thin
# slice (the opening of the conversation plus its tail, skipping the bulky tool
# output in the middle) rather than the whole transcript. Roughly 4 chars per
# token: 12000 is about 3k tokens, which fits anything. Raise it per provider
# below if you point one at a bigger model.
max_input_chars = 12000

# One command per provider, so each summary is billed to that agent's own
# subscription and no API keys are needed. The transcript excerpt arrives on
# stdin; the command should print a summary to stdout. Pick the cheapest model
# each provider offers — this is a summarising job, not a reasoning one.
#
# The don't-persist flags matter as much as the model. These CLIs record a run
# as a real session, so without them every summary leaves a conversation of
# orbit's own lying about — one that can be resumed, sorted by tokens, and
# summarised in turn. Copilot has no such flag; orbit runs all of them in a
# directory of its own so what it cannot prevent it can at least keep out of
# your projects.
[summary.claude]
command = ["claude", "-p", "--no-session-persistence", "--model", "claude-haiku-4-5-20251001", "--allowed-tools", ""]
# max_input_chars = 24000

# No --model here on purpose: gpt-5-mini is rejected outright by ChatGPT-account
# logins ("not supported when using Codex with a ChatGPT account"), which made
# codex summaries fail for anyone signed in that way. The account default works
# everywhere; add --model back if yours offers something cheaper.
[summary.codex]
command = ["codex", "exec", "--ephemeral", "--sandbox", "read-only", "--skip-git-repo-check"]

[summary.copilot]
command = ["copilot", "-p", "-s", "--no-ask-user", "--available-tools", ""]

[update]
# Check GitHub for a newer orbit on start — at most once a day, cached in
# ~/.cache/orbit/update.json — and install it, the same way this copy was
# installed: through brew for a Homebrew install, `go install` for a
# go-installed one, and a checksum-verified binary swap otherwise. orbit
# restarts itself once the new version is in place. Set ORBIT_NO_UPDATE=1 to
# skip it for one run.
auto = true
