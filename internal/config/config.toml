# orbit configuration. A key you delete falls back to its default, and orbit
# appends settings to this file as it gains them — it never edits or reorders
# what is already here, so anything you change stays changed.
# Environment variables (ORBIT_ICONS, ORBIT_SPAWN_DELAY, ...) still win over
# this file, so you can override a setting for one run without editing it.

# text | logo | auto   — the real agent marks need a terminal that speaks
# Kitty graphics (Ghostty, Kitty). auto uses them there and the cl/cx/cp text
# tags everywhere else; text pins it to the tags.
icons = "auto"

# smart | tab | window | inline   — what Enter does
attach = "smart"

# Desktop notification when a session starts wanting your attention.
notify = true

# Sessions older than this are hidden until you press `a`.
recent_days = 30

# age | tokens | project | agent   — press `o` to cycle at runtime
sort = "age"

# Group the list under project headings.
group = false

# Give the shell time to start before typing into it.
spawn_delay = "900ms"
tab_delay = "1s"

[summary]
# Summaries are generated on demand and cached, keyed by the session's last
# event — so a summary is only ever computed once per conversation state.
enabled = true

# Summarise whichever session you're sitting on, without pressing `s`.
# Off by default: it spends tokens as you browse.
auto = false

# Guards on automatic regeneration. A summary goes stale as soon as the session
# gains a message, but regenerating on every turn would bill you per prompt —
# so `auto` waits until a session is this far behind, and never interrupts a
# session that is mid-turn. Manual `s` ignores both and updates immediately.
auto_min_new_messages = 8

# Cap on the summary text itself.
max_chars = 420

# Cap on what gets *sent*. Summarising runs on cheap models, and cheap models
# have the smallest context windows — so the excerpt is deliberately a thin
# slice (the opening of the conversation plus its tail, skipping the bulky tool
# output in the middle) rather than the whole transcript. Roughly 4 chars per
# token: 12000 is about 3k tokens, which fits anything. Raise it per provider
# below if you point one at a bigger model.
max_input_chars = 12000

# One command per provider, so each summary is billed to that agent's own
# subscription and no API keys are needed. The transcript excerpt arrives on
# stdin; the command should print a summary to stdout.
#
# orbit owns these commands and updates them with each release, so they are
# not written here. They depend on things that change underneath us: which
# flag stops a CLI recording a session of its own, which models a provider
# will actually accept, which subcommand the installed version has. A copy
# frozen into your file on the day you installed orbit would go wrong quietly.
#
# To take one over, write it yourself:
#
#   [summary.codex]
#   command = ["codex", "exec", "--ephemeral", "--model", "something-cheaper"]
#
# orbit then leaves it alone for good. If you do, keep the flag that stops the
# CLI recording a session — --no-session-persistence for claude, --ephemeral
# for codex — or every summary leaves a conversation of orbit's own behind,
# resumable and counted in the token sort. Copilot has no such flag, so orbit
# runs all three in ~/.cache/orbit/scratch and hides sessions found there.
[summary.claude]
command = ["claude", "-p", "--no-session-persistence", "--model", "claude-haiku-4-5-20251001", "--allowed-tools", ""]
# max_input_chars = 24000

# If you set a codex command, don't reach for --model gpt-5-mini: ChatGPT-account
# logins refuse it outright ("not supported when using Codex with a ChatGPT
# account"), which is why the default names no model at all and takes whatever
# the account gives it.
[summary.codex]
# max_input_chars = 24000
command = ["codex", "exec", "--ephemeral", "--sandbox", "read-only", "--skip-git-repo-check"]

# Copilot is the one with no way to skip recording a session, so its summaries
# rely entirely on the scratch directory to stay out of your projects.
[summary.copilot]
# max_input_chars = 24000
command = ["copilot", "-p", "-s", "--no-ask-user", "--available-tools", ""]

# Press `d` to hand an agent a task without opening a terminal for it. orbit
# starts the agent headlessly, reads its own JSONL event stream — so the state
# in the list is reported rather than inferred — and the run appears as an
# ordinary session you can take over with Enter at any point.
#
# Claude is the only one of the three that can ask for permission in this mode,
# and it asks orbit rather than you. Orbit's answer is always to stop: it
# interrupts the turn and marks the session "needs you", so you resume it
# interactively and approve there, with the whole conversation in front of you.
# Codex and copilot have no approval channel here at all, so a dispatch to
# either runs to the end under whatever their own settings permit.
[dispatch]
# How long a dispatched run may take before orbit stops it. Copilot in
# particular has been measured sitting for four minutes on one shell call, so
# this is what ends a run that has stopped making progress.
timeout = "30m"

# What claude's permission rules should be for a dispatched run, as
# --permission-mode: acceptEdits, auto, bypassPermissions, manual, dontAsk or
# plan. Empty — the default — passes nothing, so a dispatch obeys the same
# settings your own claude does and stops in exactly the places it would have
# prompted you. Set "manual" if you would rather be asked about everything an
# unattended run does; there is no cost to being stopped, since taking a
# session over resumes it where it left off.
claude_permission_mode = ""

# Copilot's CLI refuses to run non-interactively without --allow-all-tools, so
# dispatching one means it may run any tool it likes, unattended, with no
# prompt. That is a decision rather than a default: until this is true, `d` on
# a copilot session explains itself instead of dispatching.
copilot_allow_all_tools = false

[update]
# Check GitHub for a newer orbit on start — at most once a day, cached in
# ~/.cache/orbit/update.json — and install it, the same way this copy was
# installed: through brew for a Homebrew install, `go install` for a
# go-installed one, and a checksum-verified binary swap otherwise. orbit
# restarts itself once the new version is in place. Set ORBIT_NO_UPDATE=1 to
# skip it for one run.
auto = true
