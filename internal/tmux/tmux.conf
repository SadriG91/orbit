# orbit — config for the dedicated `orbit` tmux server only.
# This never touches a normal `tmux` invocation: orbit always runs
# `tmux -L orbit`, which is a separate server with a separate socket.

# Terminal fidelity: make tmux as transparent as possible under Ghostty.
set  -g  default-terminal   "tmux-256color"
set  -ga terminal-features  ",xterm-ghostty:RGB:hyperlinks:usstyle:extkeys:clipboard:focus:title"
set  -as terminal-features  ",*:extkeys"
set  -s  extended-keys      on
set  -g  allow-passthrough  on
set  -g  set-clipboard      on
set  -g  focus-events       on

# No chrome — a session should look like a plain Ghostty tab.
set  -g  status             off

# Tab titles. orbit stashes "<short pwd> · <ai title>" in @orbit_title per
# session; tmux pushes it out as OSC 2, which Ghostty uses for the tab label.
# Ignoring #{pane_title} is deliberate — it stops Claude Code from clobbering it.
set  -g  set-titles         on
set  -g  set-titles-string  "#{?@orbit_title,#{@orbit_title},#{session_name}}"
setw -g  automatic-rename   off

set  -g  mouse              on
set  -g  history-limit      100000
set  -s  escape-time        0
set  -g  renumber-windows   on
setw -g  aggressive-resize  on

# Sessions outlive their viewport. Closing the Ghostty tab (cmd+W) detaches
# the client; the session keeps running until orbit kills it (x) or it exits.
set  -g  destroy-unattached off
set  -g  detach-on-destroy  off

# C-b would be stolen from Claude Code's input line. Move it somewhere inert.
# You rarely need it: cmd+W detaches, orbit does the rest.
set  -g  prefix C-o
unbind C-b
bind C-o send-prefix
